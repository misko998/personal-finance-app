<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Moj Budžet</title>
  <meta name="description" content="Praćenje ličnih troškova po mesecima — radi offline, podaci ostaju na telefonu.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#164f41" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f231d" media="(prefers-color-scheme: dark)">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- iPhone: rad preko celog ekrana kad se doda na početni ekran -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budžet">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <header id="topbar" class="topbar"></header>
    <main id="view" class="view" tabindex="-1">
      <div class="loading" aria-live="polite">Učitavanje…</div>
    </main>

    <nav class="tabbar" aria-label="Glavna navigacija">
      <a class="tab" href="#pregled" data-route="pregled">
        <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
        <span>Pregled</span>
      </a>
      <a class="tab" href="#istorija" data-route="istorija">
        <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Istorija</span>
      </a>
      <button type="button" id="fab" class="fab" aria-label="Dodaj trošak ili priliv">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <a class="tab" href="#kategorije" data-route="kategorije">
        <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
        <span>Kategorije</span>
      </a>
      <a class="tab" href="#podesavanja" data-route="podesavanja">
        <svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
        <span>Podešavanja</span>
      </a>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <noscript><p style="padding:24px">Za rad aplikacije potreban je JavaScript.</p></noscript>
</body>
</html>
